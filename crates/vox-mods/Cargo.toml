[package]
name = "vox-mods"
version = "0.1.0"
description = "The mod system: manifests, discovery, dependency resolution, the Lua sandbox and block events. Knows nothing about rendering."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Versions and version requirements; the default `std` feature is the only one used and the
# crate has no dependencies of its own.
semver = "1.0.28"
# The Lua 5.4 interpreter for mod scripts (decision 0014, section b). `vendored` compiles Lua from
# source with the C compiler the Rust MSVC toolchain already needs, so no Lua install is required.
# No `send`, `async` or `serialize`: one state lives on the main thread and takes plain values.
# 0.11 is the newest line that builds with the workspace's Rust 1.85 (0.12 needs 1.88).
mlua = { version = "0.11.6", default-features = false, features = ["lua54", "vendored"] }
# Linear-time substring search for the sandbox's plain `string.find`; already in the lock
# through `serde_json`.
memchr = "2.8.3"
vox-resources = { path = "../vox-resources" }
# The world handle of event handlers reads blocks of `World` and names them through
# `BlockRegistry` (decision 0014, section d).
vox-world = { path = "../vox-world" }

[lints]
workspace = true
