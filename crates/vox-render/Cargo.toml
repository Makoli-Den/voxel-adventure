[package]
name = "vox-render"
version = "0.1.0"
description = "Rendering layer. The only crate that knows about the graphics API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
naga = { version = "28.0.0", features = ["glsl-in", "spv-out"] }
raw-window-handle = { version = "0.6.2", features = ["std"] }
vox-world = { path = "../vox-world" }

[dev-dependencies]
# Builds real camera matrices in the camera-relative tests, the way the game does.
glam = "0.34.3"
